name = "marauders-api"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Neon: wrangler secret put DATABASE_URL
# Auth: wrangler secret put JWT_SIGNING_SECRET  (>= 32 random bytes, e.g. openssl rand -base64 48)
# Apple: wrangler secret put APPLE_CLIENT_ID  (iOS bundle id, e.g. com.somsak.Marauders)
# Apple, to delete an account (docs/adr/011-account-deletion.md): the Sign in with Apple key. Without all three, deleting an
# Apple account answers 503. The key file goes in through stdin and is never pasted into a chat, a file or a command line.
#   wrangler secret put APPLE_TEAM_ID  (10 characters, developer.apple.com, Membership details)
#   wrangler secret put APPLE_KEY_ID  (10 characters, the id of the key)
#   wrangler secret put APPLE_PRIVATE_KEY < AuthKey_XXXXXXXXXX.p8

# Which environment this Worker is. `/health` reports it. The top level of this file is production; staging is
# [env.staging] at the end of the file and repeats everything it needs (a wrangler environment inherits nothing).
# Staging is defined here but not provisioned yet (ADR-010, 2026-11-20): it needs its own bucket, database and
# secrets before `npm run deploy:staging` can work.
[vars]
ENVIRONMENT = "production"

[[r2_buckets]]
binding = "VIDEOS"
bucket_name = "marauders-videos"

# Cloudflare Rate Limiting bindings — a cheap, per-location first line of
# defence (no extra latency). The authoritative limits for auth/upload live in
# Neon (see src/rateLimit.ts) because the platform binding is currently
# unreliable in production. All bindings share one namespace_id and are
# separated by key prefix.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
[ratelimits.simple]
limit = 120
period = 60

[[ratelimits]]
name = "AUTH_RATE_LIMITER"
namespace_id = "1001"
[ratelimits.simple]
limit = 30
period = 60

# Staging. A wrangler environment inherits no bindings, vars or observability, so everything the top level has is
# repeated here (test/scripts/parity.test.mjs fails when it is not). Production is the top level above.
[env.staging]

[env.staging.vars]
ENVIRONMENT = "staging"

[env.staging.observability]
enabled = true

[[env.staging.r2_buckets]]
binding = "VIDEOS"
bucket_name = "marauders-videos-staging"

[[env.staging.ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1002"
[env.staging.ratelimits.simple]
limit = 120
period = 60

[[env.staging.ratelimits]]
name = "AUTH_RATE_LIMITER"
namespace_id = "1002"
[env.staging.ratelimits.simple]
limit = 30
period = 60
